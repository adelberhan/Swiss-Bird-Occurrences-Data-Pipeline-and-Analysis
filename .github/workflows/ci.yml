name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - dev
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

  dbt-parse:
    name: dbt Parse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build code_location

      - name: Run dbt parse
        run: >
          docker compose run --rm
          -e DBT_PROFILES_DIR=/app/dbt-Swiss-Bird-Occurrences-Data-Pipeline-and-Analysis/bird_project_week2
          code_location
          dbt parse

  dagster-check:
    name: Dagster Definitions Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build code_location

      - name: Check Dagster definitions
        run: >
          docker compose run --rm
          code_location
          dagster
          definitions
          validate
          -m
          dagster_project.definitions